# GitHub Repository & Branch Protection Settings (Configuration as Code)
# Compatible with Probot Settings (https://github.com/probot/settings)

repository:
  name: shapez-steam-multiplayer-mod
  description: "Steam Multiplayer Co-op Mod & Native Lobby Matchmaking for shapez"
  topics:
    - shapez
    - shapez-io
    - multiplayer
    - steam
    - electron
    - mod
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - "Build & Test (Windows)"
      enforce_admins: false
      restrictions: null
