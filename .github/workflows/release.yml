name: Build & Publish Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Publish Mod Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Release Version
        id: release_version
        run: node scripts/get-next-version.js

      - name: Setup MSBuild / csc
        uses: microsoft/setup-msbuild@v2

      - name: Run Test Suite
        run: npm test

      - name: Build Distribution Package
        run: npm run package

      - name: Run Installer Binary Smoke Test
        run: node --test tests/installer-cli.test.js

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            dist/ShapezCoopInstaller.exe
            dist/shapez-steam-coop-mod-*.zip
            dist/SHA256SUMS.txt

      # Publish Official Release (Automated patch bump on master, or specific tag on v* push)
      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.RELEASE_TAG }}
          name: ${{ steps.release_version.outputs.RELEASE_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/ShapezCoopInstaller.exe
            dist/shapez-steam-coop-mod-*.zip
            dist/SHA256SUMS.txt
