name: Build & Publish Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Publish Mod Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild / csc
        uses: microsoft/setup-msbuild@v2

      - name: Run Test Suite
        run: npm test

      - name: Build Distribution Package
        run: npm run package

      - name: Run Installer Binary Smoke Test
        run: node --test tests/installer-cli.test.js

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            dist/ShapezCoopInstaller.exe
            dist/shapez-steam-coop-mod-*.zip
            dist/SHA256SUMS.txt

      # Permanent Versioned Release for Git Tags (e.g. v1.0.0)
      - name: Publish Versioned Milestone Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "shapez Steam Co-op Mod ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ShapezCoopInstaller.exe
            dist/shapez-steam-coop-mod-*.zip
            dist/SHA256SUMS.txt

      # Rolling Continuous Release for Commits to master
      - name: Publish Continuous Pre-Release (latest-dev)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest-dev
          name: "Continuous Build (latest-dev)"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            ### ⚠️ Bleeding-Edge Continuous Build
            This rolling release was automatically built from commit `${{ github.sha }}` on branch `master`.
            
            - **Installer:** Download `ShapezCoopInstaller.exe` below.
            - **Manual Zip:** Download `shapez-steam-coop-mod-*.zip` below.
            - **Integrity:** Verify with `SHA256SUMS.txt`.
          files: |
            dist/ShapezCoopInstaller.exe
            dist/shapez-steam-coop-mod-*.zip
            dist/SHA256SUMS.txt
